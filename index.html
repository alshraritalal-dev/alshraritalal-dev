/* Adaptive daily roadmap */
.planGrid{display:grid;gap:11px;margin-top:15px}
.planDay{display:grid;grid-template-columns:140px 1fr auto;gap:16px;align-items:center;padding:15px 17px;background:var(--panel);border:1px solid var(--border);border-radius:15px}
.planDay.current{border:2px solid var(--brand);background:#f2faf9}
.planDate{display:flex;flex-direction:column;align-items:flex-start;gap:7px;font-size:12px;white-space:nowrap}
.planBody strong{font-size:15px}.planBody p{font-size:13px;margin:5px 0}.planBody small{color:var(--muted);font-size:11px}
.planBtns{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
@media(max-width:1000px){.planDay{grid-template-columns:1fr}.planDate{flex-direction:row;align-items:center}.planBtns{justify-content:flex-start}}
@media(max-width:420px){.planDay{padding:11px}.planBtns .btn{padding:9px 10px}}

.arabicMath{direction:ltr;unicode-bidi:isolate;font-feature-settings:"lnum" 1;}
.arabicDateShell{display:block;position:relative;min-width:0;width:100%;}
.arabicDateShell input[type="date"]{color:transparent!important;width:100%;min-width:0;}
.arabicDateShell input[type="date"]::-webkit-datetime-edit{color:transparent!important;}
.arabicDateMirror{pointer-events:none;position:absolute;left:15px;top:50%;transform:translateY(-50%);direction:ltr;unicode-bidi:isolate;color:var(--ink);font-weight:500;font-size:1rem;white-space:nowrap;}
input[data-ar-numeric]{direction:ltr;text-align:center;font-variant-numeric:lining-nums;}
.quizTitle,.option,.feedback,.passage,.panel p{overflow-wrap:anywhere;}
/* Guided tutor v2.1: hands-on mathematics rather than decorative motion. */
.tutorFeature{border:1px solid #a6d7c6;background:linear-gradient(125deg,#eaf8f2,#f6fbfd);border-radius:20px;padding:23px;margin:18px 0;box-shadow:0 9px 25px #113f4b0d}
.tutorFeature h3{margin:9px 0 5px;font-size:21px;color:#123d42}.tutorFeature p{color:#466a6a;margin:4px 0 12px;font-size:14px}
.tutorMain{max-width:910px;margin:0 auto}.tutorBody{padding-top:16px}.tutorBody>h2{margin:6px 0 14px;line-height:1.5;font-size:clamp(20px,2.5vw,28px)}
.tutorTimeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:18px}
.tutorTimeline span{font-size:11px;text-align:center;border-radius:10px;background:#eef3f1;padding:9px 3px;color:#556c70}
.tutorTimeline .current{background:var(--brand);color:white;font-weight:900}
.tutorQuestion{border:1px solid #daece5;background:#fafdfc;padding:20px;border-radius:18px;margin-top:17px}
.tutorQuestion h3{font-size:clamp(19px,2.5vw,24px);line-height:1.7;color:#15424a;margin:13px 0 17px}
.tutorNumberForm{display:grid;gap:11px}.tutorNumberForm label{font-weight:bold}
.tutorNumberLine{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}.tutorNumberLine input{flex:1;min-width:0;border:2px solid #b9d7d0;border-radius:13px;padding:12px 15px;background:white;color:#15364b;font-size:18px;text-align:center;direction:ltr}.tutorNumberLine .btn{flex-shrink:0}
.percentGrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;max-width:420px;margin:15px auto;direction:ltr}
.percentGrid i{aspect-ratio:1/1;border-radius:4px;border:1px solid #b7d4d1;background:white;display:block}
.percentGrid i.filled{background:#30ac90;border-color:#16866f}
.tutorSlider{display:grid;gap:5px;max-width:500px;margin:15px auto}.tutorSlider input{width:100%;accent-color:var(--brand);height:29px;cursor:pointer}
.tutorLive{font-size:13px;margin-top:12px;color:#326a61;min-height:24px}.tutorMiniExample{background:#e9f8f1;padding:12px 15px;border-right:4px solid #49a18a;border-radius:10px;margin:15px 0}
.tutorReasonGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tutorReasonGrid button{white-space:normal;line-height:1.6}
@media(max-width:700px){.tutorMain{padding:16px}.tutorTimeline span{font-size:9px;padding:8px 2px}.tutorQuestion{padding:14px}.tutorReasonGrid{grid-template-columns:1fr}.tutorNumberLine{display:grid}.tutorNumberLine button{width:100%}.tutorFeature{padding:16px}}

/* Rihla Learning Brain v2.2: simple evidence-based learning UI */
.brainFeature{border:1px solid #9bd6cb;background:linear-gradient(135deg,#f2fbf8,#ffffff);margin:18px 0}.brainFeature h2{font-size:clamp(1.4rem,2.5vw,2rem);margin:8px 0}.brainFeature h3{margin:10px 0}.brainAllocation{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:20px 0}.brainAllocation>div{background:#f0f7f5;border:1px solid #d4ebe5;border-radius:12px;padding:12px 6px;text-align:center}.brainAllocation b{display:block;font-size:1.16rem}.brainAllocation span{display:block;font-size:.8rem;color:#4f7371}.brainScenarios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.brainScenario{border:1px solid #dce9e7;border-radius:17px;padding:14px;display:flex;flex-direction:column;gap:8px}.brainScenario.selected{border-color:#13857e;background:#f3faf9}.brainScenario button{margin-top:auto}.brainSkills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.brainSkill{border:1px solid #dce9e7;border-radius:14px;padding:13px;min-width:0}.brainSkill p{margin:6px 0}.brainSkill .inlineActions{margin:10px 0 0}@media(max-width:740px){.brainAllocation{grid-template-columns:repeat(2,minmax(0,1fr))}.brainScenarios,.brainSkills{grid-template-columns:1fr}.brainFeature{margin:12px 0}}

/* Personal Coach v2.3: one integrated learning session instead of a decorative assistant. */
.navCoach{background:rgba(194,248,199,.12)!important;border:1px solid rgba(194,248,199,.19)!important;color:#e3ffe9!important}
.coachWelcome{padding:clamp(20px,4vw,40px);border-radius:26px;background:linear-gradient(145deg,#114d5e,#186f6b);color:#fff;box-shadow:0 18px 46px #1e636029}
.coachWelcome h2{margin:10px 0;font-size:clamp(26px,3vw,38px);line-height:1.4}.coachWelcome>p{max-width:680px;color:#e6faf5}
.coachWelcome .coachMission{background:#ffffffef;color:#17484f}.coachWelcome .coachMission p{color:#346b68}
.coachMission{background:linear-gradient(110deg,#f1faf7,#fff);border:1px solid #bfe0d4;border-right:5px solid var(--brand);padding:20px 25px;border-radius:19px;margin:0 0 16px}
.coachMission h2{font-size:clamp(22px,3vw,29px);margin:8px 0}.coachMission p{margin:4px 0 12px;line-height:1.9}
.coachNotes{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#496e69}.coachNotes span{padding:5px 11px;border-radius:99px;border:1px solid #c4e3da;background:#ffffffc9}
.coachSteps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:0 0 20px}
.coachSteps span{font-size:11px;line-height:1.55;text-align:center;padding:11px 4px;border-radius:11px;background:#edf4f2;color:#4b6b68}
.coachSteps span.current{background:var(--brand);color:#fff;font-weight:bold}.coachSteps span.completed{background:#dff4e7;color:#25705d}
.coachBridge h2{font-size:clamp(21px,3vw,30px)}.coachFractions{max-width:280px;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;direction:ltr;margin:20px auto}
.coachFractions span{aspect-ratio:1;border:2px solid #91b6a7;border-radius:9px;background:white}.coachFractions span.filled{background:#3ab394}
.coachRescue{margin:22px 0 8px;padding:16px 18px;border:1px solid #e8d2a7;background:#fff9ef;border-radius:16px}
.coachRescue strong{color:#69501c}.coachRescue p{margin:4px 0}.coachRescueDetail{background:white;border:1px solid #f5dfb6;padding:14px;border-radius:13px;margin-top:13px}
.coachMiniGrid{width:160px;max-width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;direction:ltr;margin:14px auto}

 if(!parts.length){if(raw!==translated)node.nodeValue=translated;return}

   math.textContent=hit[0];fragment.append(math);pos=hit.index+hit[0].length;

function localizeUI(root=document.body){

   }

function renderPractice(){header('التدريب التفاعلي');return `<div class="titleRow"><h2>تدرّب على فكرتك</h2><span class="badge">محاولتان وتلميح وشرح</span></div>${state.active?`<div class="notice">عندك جولة غير مكتملة <button class="btn btnOutline btnSmall" data-action="resume">استكملها</button></div>`:''}<div class="panel"><h3>جولة متنوعة (٦ أسئلة)</h3><p class="muted">نختار المهارات المحتاجة للدعم في الكمي واللفظي، مع أسئلة جديدة متى توفرت.</p><button class="btn btnTeal" data-action="startTraining">ابدأ جولة متنوعة</button></div>${caption('أو اختر مهارة','تدرّب على فكرة واحدة')}
 <div class="skills">${DATA.skills.map(s=>`<button class="skill" data-action="openLesson" data-skill="${s.id}"><b>${safe(s.title)}</b><small>${s.section==='quant'?'كمي':'لفظي'} • ${ar(availableForSkill(s.id).length)} سؤال جديد</small><div class="progress"><span style="width:${skillScore(s.id).pct}%"></span></div></button>`).join('')}</div>`}
function renderErrors(){header('دفتر الأخطاء');let list=state.review.slice().sort((a,b)=>a.due.localeCompare(b.due)),mistakes=state.attempts.filter(a=>!a.correctFirst||a.confidence==='خمنت'||a.hintUsed).slice(-30).reverse();return `<div class="titleRow"><h2>أخطائي تصير فرصتي</h2><span class="badge">مراجعة ١ / ٣ / ٧ أيام</span></div><div class="grid">${statCard('↺','مستحق اليوم',ar(due().length),'المراجعة لا تحتسب كسؤال جديد')}${statCard('◎','أسئلة تحتاج تثبيتًا',ar(list.length),'الحفظ لا يكفي لإثبات الإتقان')}${statCard('◷','متوسط وقت الإجابة',stats().n?ar(stats().avg)+' ث':'—','المحاولات الأولى المسجلة')}</div><div class="panel" style="margin-top:18px"><h3>المراجعات القادمة</h3>${list.length?`<div class="stack">${list.slice(0,20).map(r=>`<div class="task"><div><strong>${safe(skill(r.skill).title)}</strong><p>${safe(byId(r.qid)?.stem.slice(0,90)||r.qid)}…</p></div><div><span class="tag ${r.due<=today()?'red':''}">${safe(formatDate(r.due))}</span></div></div>`).join('')}</div>`:'<div class="empty">ما عندك مراجعات مجدولة للحين.</div>'}<div class="inlineActions"><button class="btn btnTeal" data-action="startReview" ${due().length?'':'disabled'}>ابدأ مراجعات اليوم (${ar(due().length)})</button></div></div>${state.tutor?.percent?`<div class="tutorFeature"><h3>مراجعة المعلم التفاعلي</h3><p>النسب المئوية: ${safe(tutorStatus())} • ${state.tutor.percent.reviewDue?'تاريخ المراجعة: '+formatDate(state.tutor.percent.reviewDue):'قيد التعلم'}</p><button class="btn btnTeal" data-action="startTutor">تابع الدرس أو المراجعة</button></div>`:''}<div class="panel"><h3>آخر الأخطاء والتخمينات</h3>${mistakes.length?`<div class="stack">${mistakes.map(a=>`<div class="reportCard"><div class="rowBetween"><b>${safe(skill(a.skill).title)} • ${safe(a.qid)}</b><span class="muted small">${safe(formatDate(a.date))}</span></div><div class="small muted">${safe((a.questionSnapshot?.stem||byId(a.qid)?.stem||'سؤال قديم').slice(0,135))}</div><div class="rowBetween"><span class="tag orange">${safe(a.reason||'سبب غير محدّد')}</span><button class="btn btnOutline btnSmall" data-action="explainOld" data-qid="${safe(a.qid)}">الشرح</button></div></div>`).join('')}</div>`:'<div class="empty">تظهر هنا الأخطاء بعد بدء الجولات.</div>'}</div>`}
function mockPage(){header('المحاكاة التدريبية');let mocks=state.reports.filter(r=>r.mode==='simulate').slice().reverse();return `<div class="titleRow"><h2>جرّب تحت الوقت</h2><span class="badge">تدريب مستقل، غير رسمي</span></div><div class="panel"><span class="tag orange">مواصفات مرنة وليست مطابقة رسميًا</span><h3 style="margin-top:12px">محاكاة مضبوطة على وقتك</h3><p class="muted">نجمع أسئلة لم تُحل سابقًا قدر الإمكان، ونؤجل التصحيح حتى التسليم. أي رقم هنا إعداد تدريبي قابل للتغيير، ولا يمثل وقت أو توزيع اختبار قياس الرسمي.</p><div class="formRow"><div class="field"><label for="mockCount">عدد الأسئلة (١٠–٤٠)</label><input id="mockCount" type="text" inputmode="numeric" autocomplete="off" data-ar-numeric="1" min="10" max="40" value="${state.settings.mockCount}"></div><div class="field"><label for="mockMinutes">الوقت بالدقائق (١٠–١٢٠)</label><input id="mockMinutes" type="text" inputmode="numeric" autocomplete="off" data-ar-numeric="1" min="10" max="120" value="${state.settings.mockMinutes}"></div></div><div class="notice">إن انتهى الوقت أثناء إغلاق الصفحة، ستُسلّم المحاكاة تلقائيًا عند العودة. تتغير الساعة حسب ساعة الجهاز.</div><button class="btn btnTeal" data-action="startMock" ${state.diagnostic?'':'disabled'}>ابدأ محاكاة جديدة</button> ${!state.diagnostic?'<span class="small muted">أكمل التشخيص أولًا.</span>':''}</div>${caption('نتائج المحاكاة السابقة')}
 <div class="panel">${mocks.length?`<div class="stack">${mocks.map(r=>`<div class="task"><div><strong>${safe(formatDate(r.date))}</strong><p>${r.correct}/${r.total} صحيحة في المحاولة الأولى (دقة تدريبية)</p></div><span class="tag">${percent(r.correct,r.total)}٪</span></div>`).join('')}</div>`:'<div class="empty">ما خضت محاكاة بعد. ابدأ بعد التشخيص وبعض الدروس.</div>'}</div>`}
function followPage(){header('لوحة المتابع');if(!state.settings.followConsent)return `<div class="panel survey"><h2>لوحة متابعة بموافقة الطالب</h2><p class="muted">لا توجد حسابات أو مزامنة سحابية. ستُعرض البيانات على هذا الجهاز فقط لمن يفتحه بعد موافقة الطالب. تجنّب مشاركة ملف التقدّم دون إذن.</p><label class="check"><input type="checkbox" id="consentFollow"> أوافق على عرض ملخص تدريبي محلي للمتابع</label><div class="inlineActions"><button class="btn btnTeal" data-action="grantFollow">تفعيل المتابعة على هذا الجهاز</button></div></div>`;
 let ss=weakest().slice(0,5),st=stats();return `<div class="titleRow"><h2>ملخص أسبوعي للمتابع</h2><span class="badge">محلي بموافقة الطالب</span></div><div class="grid">${statCard('▦','أيام تدرب فيها خلال ٧ أيام',ar(weekDays())+' / ٧','لا عقوبة على الأيام الفائتة')}${statCard('◈','دقة الأسئلة الجديدة',st.n?ar(percent(st.correct,st.n))+'٪':'—','لا تعادل الدرجة الرسمية')}${statCard('◎','عدد المحاولات الأولى',ar(st.n),'كمي ولفظي')}</div><div class="panel" style="margin-top:18px"><h3>مهارات تحتاج دعمًا أولًا</h3><div class="barChart">${ss.map(s=>`<div class="barRow"><span>${safe(s.title)}</span><div class="progress"><span style="width:${s.pct}%"></span></div><b>${s.n<3?'بيانات قليلة':s.pct+'٪'}</b></div>`).join('')}</div><div class="notice">المؤشرات هنا مقتصرة على سجل هذا الجهاز، ولا تتنبأ بدرجة قياس.</div><button class="btn btnOutline btnSmall" data-action="revokeFollow">إيقاف عرض المتابعة</button></div>`}
function settingsPage(){header('الإعدادات والبيانات');return `<div class="titleRow"><h2>إعدادات رحلتك</h2><span class="badge">لا تحتاج حسابًا</span></div><div class="panel"><h3>موعد اختبارك وخطة اليوم</h3><div class="formRow"><div class="field"><label for="settingDate">موعد الاختبار</label><input type="date" id="settingDate" value="${safe(state.profile.examDate)}"></div><div class="field"><label for="compactSetting">وقت المذاكرة اليومي</label><select id="compactSetting"><option value="0" ${(state.settings.dailyMinutes||240)!==45?'selected':''}>٤ ساعات أو وقت مخصص من عقل الرحلة</option><option value="1" ${(state.settings.dailyMinutes||240)===45?'selected':''}>٤٥ دقيقة في الأيام المزدحمة</option></select></div></div><button class="btn btnTeal" data-action="saveSettings">حفظ الإعدادات</button><button class="btn btnOutline" data-page="brain">تفاصيل وقت الدراسة في عقل الرحلة</button></div><div class="panel"><h3>نقل بياناتك بين الأجهزة يدويًا</h3><p class="muted small">التقدم يحفظ في متصفح هذا الجهاز. لا توجد حسابات ولا مزامنة أو إرسال لخادم. لحفظ نسخة احتياطية أو نقلها، نزّل JSON واستورده على الجهاز الآخر.</p><div class="inlineActions"><button class="btn btnOutline" data-action="export">↓ تصدير التقدم</button><label class="btn btnOutline" for="importProgress">↑ استيراد التقدم</label><input id="importProgress" type="file" accept="application/json,.json" class="hide"></div></div><div class="panel"><h3>إدارة المحتوى والمتابعة</h3><div class="inlineActions"><button class="btn btnOutline" data-page="follow">لوحة المتابع</button><button class="btn btnOutline" data-page="admin">إضافة سؤال أو مراجعة المحتوى</button><button class="btn btnDanger" data-action="clearData">مسح تقدمي من هذا الجهاز</button></div></div><div class="panel"><h3>المصادر والشفافية</h3><p class="muted small">الأسئلة جميعها أمثلة أصلية لهذا المشروع، والتواريخ أدناه هي تاريخ فحص الروابط لا تاريخ ظهور الأسئلة في الاختبار. موقعنا لا يمثل الهيئة الرسمية.</p><div class="stack">${DATA.sources.map(x=>`<div class="task"><div><b>${safe(x.name)}</b><p>${safe(x.note)} • تحقّقنا من الرابط في ${safe(x.checked)}</p></div><a class="btn btnOutline btnSmall" href="${safe(x.url)}" target="_blank" rel="noopener noreferrer">فتح المصدر ↗</a></div>`).join('')}</div></div><div class="notice warn">الخصوصية: هذا الموقع لا يجمع اسمًا كاملًا أو رقم جوال. استخدم اسمًا أولًا اختياريًا. لا تشارك نسخة JSON لأنها تحوي إجاباتك ونتائجك.</div>`}
function adminPage(){header('إدارة محتوى محلية');let enabled=state.customQuestions.filter(q=>q.status==='approved').length;return `<div class="titleRow"><h2>إضافة سؤال أو تعديله</h2><span class="badge">${ar(enabled)} إضافات محلية معتمدة</span></div><div class="notice warn"><b>حدود الصلاحية:</b> هذا محرّر على الجهاز نفسه، وليس لوحة إدارة محمية أو متعددة المستخدمين. المحتوى المضاف لا ينتقل إلى الآخرين إلا بتصدير نسخة من المشروع أو التقدّم. لا تضف أسئلة من ملفات محمية دون إذن.</div><div class="panel"><h3>صيغة السؤال الجديد (JSON)</h3><p class="muted small">أدخِل السؤال والخيارات والإجابة الصحيحة بالترقيم من صفر إلى ثلاثة، وشرحًا وتلميحًا ومصدرًا. اضغط معاينة ثم راجع واعتمد.</p><textarea id="editorJson" dir="ltr" style="width:100%;min-height:250px;font:13px/1.6 monospace" placeholder='{"skill":"percent","stem":"سؤال أصلي...","options":["...","...","...","..."],"answer":0,"explanation":"...","hint":"...","source":"تأليف الطالب"}'></textarea><div class="inlineActions"><button class="btn btnOutline" data-action="putExample">تعبئة مثال أصلي</button><button class="btn btnTeal" data-action="previewImport">معاينة وفحص التكرار</button></div>${state.ui.editorPreview&&state.editorDraft?`<div class="lesson"><h4>معاينة قبل الاعتماد</h4><p><b>${safe(state.editorDraft.stem)}</b></p><div class="stack">${state.editorDraft.options.map((o,i)=>`<div class="reportCard">${ar(i+1)}. ${safe(o)} ${i===state.editorDraft.answer?'✓':''}</div>`).join('')}</div><p><b>شرح:</b> ${safe(state.editorDraft.explanation)}</p><label class="check"><input type="checkbox" id="hasContentRights"> أؤكد أن لدي حق نشر هذا السؤال</label><div class="inlineActions"><button class="btn btnTeal" data-action="approveImport">اعتماد وإضافته إلى بنك التدريب</button><button class="btn btnOutline" data-action="cancelImport">إلغاء المسودة</button></div></div>`:''}</div><div class="panel"><h3>المحتوى المضاف على هذا الجهاز</h3>${state.customQuestions.length?`<div class="stack">${state.customQuestions.slice().reverse().map(q=>`<div class="task"><div><b>${safe(q.id)} • ${safe(skill(q.skill).title)} • نسخة ${q.version}</b><p>${safe(q.stem.slice(0,100))}</p></div><button class="btn btnOutline btnSmall" data-action="toggleQuestion" data-qid="${safe(q.id)}">${q.status==='approved'?'إيقاف':'إعادة اعتماد'}</button></div>`).join('')}</div>`:'<div class="empty">لا توجد إضافات محلية بعد.</div>'}</div><div class="panel"><h3>ملخص النسخة الأساسية</h3><p>${ar(DATA.questions.length)} سؤالًا أصليًا مع شرح وتلميح • ${ar(DATA.lessons.length)} درسًا • مراجعة المحتوى بتاريخ ٨ نوفمبر ٢٠٢٦. نسخة الأسئلة المرفقة لا يعاد نشرها داخل الموقع.</p><div class="notice">الاختبار الحسابي الآلي تحقق من مفاتيح الأسئلة الكمية الـ${ar(DATA.questions.filter(q=>q.section==='quant').length)}؛ وهذا ليس بديلًا عن مراجعة بشرية مستقلة لكل سؤال أو معايرة الصعوبة على طلاب فعليين.</div></div>`}
function renderReport(){header('نتيجة جولتك');let r=state.lastReport;if(!r)return '<div class="empty">لا يوجد تقرير حتى الآن.</div>';let d=r.mode==='diagnostic',sub=r.bySection||{};return `<div class="titleRow"><h2>${d?'تشخيصك الأول':r.mode==='simulate'?'انتهت المحاكاة':'أحسنت على إكمال الجولة'}</h2><span class="badge">نتيجة تدريبية فقط</span></div><div class="panel"><div class="rowBetween"><div><div class="eyebrow" style="color:var(--brand)">دقة المحاولة الأولى في هذه الجولة</div><div class="resultScore">${ar(percent(r.correct,r.total))}٪</div><p class="small muted">${ar(r.correct)} صحيحة من ${ar(r.total)}؛ لا تعادل درجة قياس</p></div><div class="stat" style="box-shadow:none;min-width:200px"><div class="statLabel">التلميحات / التخمينات / المتروك</div><div class="statNum" style="font-size:22px">${ar(r.hinted)} / ${ar(r.guessed)} / ${ar(r.skipped)}</div></div></div><div class="grid" style="margin-top:18px">${['quant','verbal'].map(x=>statCard('◆',SECTIONS[x],`${ar(sub[x]?.correct||0)} من ${ar(sub[x]?.total||0)}`,'محاولات أولى فقط')).join('')}</div>${d?`<div class="notice">استنتجنا مهارات بداية من إجاباتك، لكن المهارات ذات سؤال أو سؤالين فقط «تحتاج قياسًا إضافيًا». الخطوة التالية درس عملي ثم سؤالان تأكيديان.</div>`:''}<div class="inlineActions"><button class="btn btnTeal" data-action="openLesson" data-skill="${safe(nextSkill())}">افتح أول درس مناسب ←</button><button class="btn btnOutline" data-page="home">العودة للرئيسية</button><button class="btn btnOutline" data-action="toggleSolutions">${state.ui.showReportSolutions?'إخفاء الحلول':'راجع الأسئلة والحلول'}</button></div></div>${state.ui.showReportSolutions?`<div class="panel"><h3>مراجعة بعد تسليم الجولة</h3><div class="stack">${r.responses.map((resp,i)=>{let q=byId(resp.qid)||resp.questionSnapshot; if(!q)return '';let correct=resp.first===q.answer;return `<div class="reportCard"><div class="rowBetween"><b>سؤال ${ar(i+1)} • ${safe(skill(q.skill).title)}</b><span class="tag ${correct?'':'red'}">${correct?'صحيح':'يحتاج مراجعة'}</span></div>${q.passage?`<div class="small muted">${safe(q.passage)}</div>`:''}<p>${safe(q.stem)}</p><p class="small">إجابتك الأولى: <b>${resp.first==null?'متروك':safe(q.options[resp.first])}</b> • الإجابة الصحيحة: <b>${safe(q.options[q.answer])}</b></p><p class="small muted">${safe(q.explanation)}</p>${q.evidence?`<p class="small">دليل من النص: <mark>${safe(q.evidence)}</mark></p>`:''}</div>`}).join('')}</div></div>`:''}`}
function questionArea(q, a, r){let mode=a.mode,isd=mode==='diagnostic',ism=mode==='simulate',blind=isd||ism,phase=a.phase;
 const resp=r||{},retry=isd&&phase==='retry';let selected=retry?resp.second:resp.first;
 const isReview=isd&&phase==='review';if(isReview)return '';
 const answered= !blind&&a.stage==='result';
 const status=blind?'لن نظهر التصحيح إلا بعد التسليم':a.stage==='hint'?'تلميح بدون كشف الحل':a.stage==='second'?'المحاولة الثانية':a.stage==='result'?'اكتملت الخطوة، الآن افهم الفكرة':'أجب دون مساعدة أولًا';
 const options=q.options.map((o,i)=>{let cls='';if(a.stage==='result'){if(i===q.answer)cls=' correct';else if(i===resp.first)cls=' incorrect'}else if(selected===i)cls=' selected';let can=blind||a.stage==='answer'||a.stage==='second';return `<button type="button" class="option${cls}" data-action="choose" data-index="${i}" ${can?'':'disabled'} aria-pressed="${selected===i}"><span class="optLetter">${['أ','ب','ج','د'][i]}</span><span>${safe(o)}</span></button>`}).join('');
 return `<div class="panel" style="margin-top:16px"><div class="quizTop"><div><span class="tag">${safe(SECTIONS[q.section])} • ${safe(skill(q.skill).title)}</span> <span class="small muted">سؤال ${ar(a.idx+1)} من ${ar(a.ids.length)}</span></div><span class="tag ${a.stage==='hint'?'orange':''}">${safe(status)}</span></div><div class="progress" style="margin-top:14px"><span style="width:${percent(a.idx,a.ids.length)}%"></span></div>
 ${q.passage?`<div class="passage"><span class="tag">النص المشترك • ${safe(q.passageId)}</span><div>${safe(q.passage)}</div></div>`:''}<h2 class="quizTitle">${safe(q.stem)}</h2>

const percentageProblem=(id,p,base,mode='portion')=>{

 if(!Number.isInteger(part)||part<=0)throw Error('مسألة نسبة غير صالحة: '+id);

 const prompt=mode==='portion'?`ما قيمة ${p}٪ من ${base}؟`:
 mode==='discount'?`ثمن غرض ${base} ريالًا، خُفّض ${p}٪. كم السعر بعد الخصم؟`:
 `ثمن غرض ${base} ريالًا، زاد ${p}٪. كم السعر بعد الزيادة؟`;
 const explanation=`${p}٪ من ${base} = ${base} × ${p} ÷ ١٠٠ = ${part}. `+
 (mode==='discount'?`نطرح الخصم من السعر الأصلي: ${base} − ${part} = ${expected}.`:

};

function universalAdvance(){const sid=universalData().active,m=RihlaUniversal.modules[sid],t=universalProgress(sid);if(!t.feedback)return;

 t.feedback=null;t.rescueLevel=0;t.rescueUsed=false;t.index++;t.enteredAt=Date.now();

function universalIndex(){let root=universalData();return `<section class="hero"><div class="heroLeft"><span class="eyebrow">الجيل الثالث • أربع مسارات تفاعلية</span><h2>علّمني خطوة بخطوة</h2><p>تشخيص حقيقي، شرح مختلف حسب المهارة، حل موجّه، تدريب مستقل، اختبار تطبيق جديد، ومراجعة بعد يوم. لا نعلن الإتقان من جلسة واحدة.</p></div><div class="heroCircle"><strong>٤</strong><span>مهارات أولية</span></div></section><div class="u-catalog">${Object.entries(RihlaUniversal.modules).map(([id,m])=>{let t=root.skills[id],due=t?.reviewDue&&t.reviewDue<=today();return `<article class="panel u-card"><span class="badge">${m.section==='quant'?'كمي':'لفظي'}</span><h3>${safe(m.title)}</h3><p>${safe(m.goal)}</p><div class="small muted">${!t?'لم تبدأ بعد':t.retained?'اجتزت مراجعة مؤجلة':due?'مراجعة مستحقة':t.phase==='done'?'تحقق مستقل أولي':t.phase==='needs-work'?'تحتاج إلى أدلة تدريب جديدة':'يمكنك استكمال المسار'}</div><button class="btn btnTeal" data-action="uStart" data-skill="${id}">${!t?'ابدأ التشخيص':due?'ابدأ المراجعة':'فتح مسار التعلم'}</button></article>`}).join('')}</div><div class="notice">الدروس الأربعة أول دفعة من المحرك العام. بقية المهارات تستخدم التدريب والدروس السابقة، ولم تُعلن مكتملة تفاعليًا. التقييم منفصل عن أسئلة التدريب.</div>`;}
function universalPage(){header('أكاديمية التأسيس التفاعلي');let root=universalData();if(!root.active||!RihlaUniversal.modules[root.active])return universalIndex();if(state.ui.academyIndex)return universalIndex();const sid=root.active;return universalSkillPage(sid,RihlaUniversal.modules[sid],universalProgress(sid))}
function universalHandle(action,button){if(action==='uStart'){state.ui.academyIndex=false;universalStart(button.dataset.skill);return}if(action==='uIndex'){state.ui.academyIndex=true;save();render();return}
 if(action==='uFractionTile'){const t=universalProgress(universalData().active);if(t.phase!=='concept'||universalData().active!=='fractions')return;let ix=Number(button.dataset.index);if(!Number.isInteger(ix)||ix<0||ix>3)return;t.visualTiles=Array.isArray(t.visualTiles)?t.visualTiles:[];t.visualTiles=t.visualTiles.includes(ix)?t.visualTiles.filter(x=>x!==ix):[...t.visualTiles,ix];save();render();return}if(action==='uRatioFactor'){const t=universalProgress(universalData().active);if(t.phase!=='concept'||universalData().active!=='ratio')return;const factor=Number(button.dataset.factor);if(![1,2,3,4].includes(factor))return;t.ratioFactor=factor;save();render();return}
 if(action==='uChoice')return universalChoice(Number(button.dataset.index));if(action==='uConcept')return universalConcept(Number(button.dataset.index));if(action==='uGuided')return universalEnterGuided();if(action==='uNext')return universalAdvance();if(action==='uRescue')return universalRescue();if(action==='uReview')return universalReview();if(action==='uRetry')return universalRestart();if(action==='uBank'){startTraining(universalData().active);return}}

document.addEventListener('click',handle);
document.addEventListener('change',e=>{if(e.target.matches?.('input[type="date"]')){const mirror=e.target.closest('.arabicDateShell')?.querySelector('.arabicDateMirror');if(mirror)mirror.textContent=arabicDateLabel(e.target.value)}if(e.target.id==='confidence'){changeConfidence()}if(e.target.id==='reason'){let r=currentResp();r.reason=e.target.value;save()}if(e.target.id==='importProgress')importProgress(e.target.files[0])});
document.addEventListener('keydown',e=>{let el=document.activeElement;if(['INPUT','TEXTAREA','SELECT'].includes(el?.tagName))return;if(!state.active||state.ui.page!=='session')return;if(['1','2','3','4'].includes(normalizeDigits(e.key))&&e.key.length===1){let index=Number(normalizeDigits(e.key))-1;if(state.active.mode==='diagnostic'||state.active.mode==='simulate'||state.active.stage==='answer'||state.active.stage==='second'){choose(index)}}});
function tick(){let a=state.active;if(!a||a.mode!=='simulate')return;if(Date.now()>=a.deadline){finishSession();toast('انتهى الوقت وتم تسليم المحاكاة مرة واحدة.');return}let label=$('#sessionTimer');if(label)label.textContent='الوقت المتبقي: '+timerText(a)}
if(state.active?.mode==='simulate'&&Date.now()>=state.active.deadline){finishSession()}else{if(state.active){state.active.paused=true;if(state.ui.page==='session')state.ui.page='home'}render()}
setInterval(tick,1000);localizeUI(document.body);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
