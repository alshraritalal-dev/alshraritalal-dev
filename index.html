const percent=(n,d)=>d?Math.round(100*n/d):0;
const stats=section=>{let as=firstAttempts(section);return {n:as.length,correct:as.filter(a=>a.correctFirst&&!a.hintUsed&&a.confidence!=='خمنت').length,rawCorrect:as.filter(a=>a.correctFirst).length,avg:as.length?Math.round(as.reduce((s,a)=>s+(a.seconds||0),0)/as.length):0,skipped:as.filter(a=>a.first==null).length}};
const statsFor=id=>state.attempts.filter(a=>a.skill===id&&a.first!==undefined&&a.first!==null);
function skillScore(id){let a=statsFor(id);if(!a.length)return {n:0,pct:0,level:'يحتاج قياسًا إضافيًا',ready:false};let fresh=a.filter(x=>x.mode!=='review');let latest=fresh.slice(-10);let right=latest.filter(x=>x.correctFirst&&!x.hintUsed&&x.confidence!=='خمنت').length;let p=percent(right,latest.length);const confirmed=latest.length>=10&&right>=8&&a.some(x=>x.mode==='review'&&x.correctFirst&&x.confidence!=='خمنت');return {n:latest.length,pct:p,level:confirmed?'ثبت إتقانه':latest.length>=10&&right>=8?'جاهز لتأكيد لاحق':latest.length<3?'يحتاج قياسًا إضافيًا':p>=70?'يتقدم':'يحتاج مراجعة',ready:confirmed}}
function weakest(section){const arr=DATA.skills.filter(x=>!section||x.section===section).map(x=>({...x,...skillScore(x.id)}));arr.sort((a,b)=>{const rank=x=>x.n===0?65:x.n<3?20+0.6*x.pct:x.pct;return rank(a)-rank(b)});return arr}

function planPreview(){const left=remaining(state.profile.examDate),days=Math.max(1,Math.min(30,left>0?left:7));const orderedQ=weakest('quant'),orderedV=weakest('verbal');const plans=[];

 return `<div class="panel"><div class="rowBetween"><div><h3>جدولك المتجدّد من اليوم</h3><p class="muted small">نعيد ترتيب الأيام المتبقية وفق موعدك ومستوى المحاولات المستقلة؛ المهارات التي لم تُقَس تظهر تدريجيًا. هذه مواعيد تدريبية مقترحة، لا برنامجًا رسميًا.</p></div><span class="badge">${ar(days)} يومًا</span></div><div class="planGrid">${plans.join('')}</div></div>`}

 <div class="panel">${mocks.length?`<div class="stack">${mocks.map(r=>`<div class="task"><div><strong>${safe(formatDate(r.date))}</strong><p>${r.correct}/${r.total} صحيحة في المحاولة الأولى (دقة تدريبية)</p></div><span class="tag">${percent(r.correct,r.total)}٪</span></div>`).join('')}</div>`:'<div class="empty">ما خضت محاكاة بعد. ابدأ بعد التشخيص وبعض الدروس.</div>'}</div>`}
function followPage(){header('لوحة المتابع');if(!state.settings.followConsent)return `<div class="panel survey"><h2>لوحة متابعة بموافقة الطالب</h2><p class="muted">لا توجد حسابات أو مزامنة سحابية. ستُعرض البيانات على هذا الجهاز فقط لمن يفتحه بعد موافقة الطالب. تجنّب مشاركة ملف التقدّم دون إذن.</p><label class="check"><input type="checkbox" id="consentFollow"> أوافق على عرض ملخص تدريبي محلي للمتابع</label><div class="inlineActions"><button class="btn btnTeal" data-action="grantFollow">تفعيل المتابعة على هذا الجهاز</button></div></div>`;
 let ss=weakest().slice(0,5),st=stats();return `<div class="titleRow"><h2>ملخص أسبوعي للمتابع</h2><span class="badge">محلي بموافقة الطالب</span></div><div class="grid">${statCard('▦','أيام تدرب فيها خلال ٧ أيام',ar(weekDays())+' / ٧','لا عقوبة على الأيام الفائتة')}${statCard('◈','دقة الأسئلة الجديدة',st.n?ar(percent(st.correct,st.n))+'٪':'—','لا تعادل الدرجة الرسمية')}${statCard('◎','عدد المحاولات الأولى',ar(st.n),'كمي ولفظي')}</div><div class="panel" style="margin-top:18px"><h3>مهارات تحتاج دعمًا أولًا</h3><div class="barChart">${ss.map(s=>`<div class="barRow"><span>${safe(s.title)}</span><div class="progress"><span style="width:${s.pct}%"></span></div><b>${s.n<3?'بيانات قليلة':s.pct+'٪'}</b></div>`).join('')}</div><div class="notice">المؤشرات هنا مقتصرة على سجل هذا الجهاز، ولا تتنبأ بدرجة قياس.</div><button class="btn btnOutline btnSmall" data-action="revokeFollow">إيقاف عرض المتابعة</button></div>`}
function settingsPage(){header('الإعدادات والبيانات');return `<div class="titleRow"><h2>إعدادات رحلتك</h2><span class="badge">لا تحتاج حسابًا</span></div><div class="panel"><h3>موعد اختبارك وخطة اليوم</h3><div class="formRow"><div class="field"><label for="settingDate">موعد الاختبار</label><input type="date" id="settingDate" value="${safe(state.profile.examDate)}"></div><div class="field"><label for="compactSetting">وقت المذاكرة اليومي</label><select id="compactSetting"><option value="0" ${!state.settings.compact?'selected':''}>٤ ساعات تشمل الاستراحات</option><option value="1" ${state.settings.compact?'selected':''}>٤٥ دقيقة في الأيام المزدحمة</option></select></div></div><button class="btn btnTeal" data-action="saveSettings">حفظ الإعدادات</button></div><div class="panel"><h3>نقل بياناتك بين الأجهزة يدويًا</h3><p class="muted small">التقدم يحفظ في متصفح هذا الجهاز. لا توجد حسابات ولا مزامنة أو إرسال لخادم. لحفظ نسخة احتياطية أو نقلها، نزّل JSON واستورده على الجهاز الآخر.</p><div class="inlineActions"><button class="btn btnOutline" data-action="export">↓ تصدير التقدم</button><label class="btn btnOutline" for="importProgress">↑ استيراد التقدم</label><input id="importProgress" type="file" accept="application/json,.json" class="hide"></div></div><div class="panel"><h3>إدارة المحتوى والمتابعة</h3><div class="inlineActions"><button class="btn btnOutline" data-page="follow">لوحة المتابع</button><button class="btn btnOutline" data-page="admin">إضافة سؤال أو مراجعة المحتوى</button><button class="btn btnDanger" data-action="clearData">مسح تقدمي من هذا الجهاز</button></div></div><div class="panel"><h3>المصادر والشفافية</h3><p class="muted small">الأسئلة جميعها أمثلة أصلية لهذا المشروع، والتواريخ أدناه هي تاريخ فحص الروابط لا تاريخ ظهور الأسئلة في الاختبار. موقعنا لا يمثل الهيئة الرسمية.</p><div class="stack">${DATA.sources.map(x=>`<div class="task"><div><b>${safe(x.name)}</b><p>${safe(x.note)} • تحقّقنا من الرابط في ${safe(x.checked)}</p></div><a class="btn btnOutline btnSmall" href="${safe(x.url)}" target="_blank" rel="noopener noreferrer">فتح المصدر ↗</a></div>`).join('')}</div></div><div class="notice warn">الخصوصية: هذا الموقع لا يجمع اسمًا كاملًا أو رقم جوال. استخدم اسمًا أولًا اختياريًا. لا تشارك نسخة JSON لأنها تحوي إجاباتك ونتائجك.</div>`}
function adminPage(){header('إدارة محتوى محلية');let enabled=state.customQuestions.filter(q=>q.status==='approved').length;return `<div class="titleRow"><h2>إضافة سؤال أو تعديله</h2><span class="badge">${ar(enabled)} إضافات محلية معتمدة</span></div><div class="notice warn"><b>حدود الصلاحية:</b> هذا محرّر على الجهاز نفسه، وليس لوحة إدارة محمية أو متعددة المستخدمين. المحتوى المضاف لا ينتقل إلى الآخرين إلا بتصدير نسخة من المشروع أو التقدّم. لا تضف أسئلة من ملفات محمية دون إذن.</div><div class="panel"><h3>صيغة السؤال الجديد (JSON)</h3><p class="muted small">أدخِل السؤال والخيارات والإجابة الصحيحة بالترقيم من صفر إلى ثلاثة، وشرحًا وتلميحًا ومصدرًا. اضغط معاينة ثم راجع واعتمد.</p><textarea id="editorJson" dir="ltr" style="width:100%;min-height:250px;font:13px/1.6 monospace" placeholder='{"skill":"percent","stem":"سؤال أصلي...","options":["...","...","...","..."],"answer":0,"explanation":"...","hint":"...","source":"تأليف الطالب"}'></textarea><div class="inlineActions"><button class="btn btnOutline" data-action="putExample">تعبئة مثال أصلي</button><button class="btn btnTeal" data-action="previewImport">معاينة وفحص التكرار</button></div>${state.ui.editorPreview&&state.editorDraft?`<div class="lesson"><h4>معاينة قبل الاعتماد</h4><p><b>${safe(state.editorDraft.stem)}</b></p><div class="stack">${state.editorDraft.options.map((o,i)=>`<div class="reportCard">${ar(i+1)}. ${safe(o)} ${i===state.editorDraft.answer?'✓':''}</div>`).join('')}</div><p><b>شرح:</b> ${safe(state.editorDraft.explanation)}</p><label class="check"><input type="checkbox" id="hasContentRights"> أؤكد أن لدي حق نشر هذا السؤال</label><div class="inlineActions"><button class="btn btnTeal" data-action="approveImport">اعتماد وإضافته إلى بنك التدريب</button><button class="btn btnOutline" data-action="cancelImport">إلغاء المسودة</button></div></div>`:''}</div><div class="panel"><h3>المحتوى المضاف على هذا الجهاز</h3>${state.customQuestions.length?`<div class="stack">${state.customQuestions.slice().reverse().map(q=>`<div class="task"><div><b>${safe(q.id)} • ${safe(skill(q.skill).title)} • نسخة ${q.version}</b><p>${safe(q.stem.slice(0,100))}</p></div><button class="btn btnOutline btnSmall" data-action="toggleQuestion" data-qid="${safe(q.id)}">${q.status==='approved'?'إيقاف':'إعادة اعتماد'}</button></div>`).join('')}</div>`:'<div class="empty">لا توجد إضافات محلية بعد.</div>'}</div><div class="panel"><h3>ملخص النسخة الأساسية</h3><p>${ar(DATA.questions.length)} سؤالًا أصليًا مع شرح وتلميح • ${ar(DATA.lessons.length)} درسًا • مراجعة المحتوى بتاريخ ٨ نوفمبر ٢٠٢٦. نسخة الأسئلة المرفقة لا يعاد نشرها داخل الموقع.</p><div class="notice">الاختبار الحسابي الآلي تحقق من مفاتيح الأسئلة الكمية الـ${ar(DATA.questions.filter(q=>q.section==='quant').length)}؛ وهذا ليس بديلًا عن مراجعة بشرية مستقلة لكل سؤال أو معايرة الصعوبة على طلاب فعليين.</div></div>`}
function renderReport(){header('نتيجة جولتك');let r=state.lastReport;if(!r)return '<div class="empty">لا يوجد تقرير حتى الآن.</div>';let d=r.mode==='diagnostic',sub=r.bySection||{};return `<div class="titleRow"><h2>${d?'تشخيصك الأول':r.mode==='simulate'?'انتهت المحاكاة':'أحسنت على إكمال الجولة'}</h2><span class="badge">نتيجة تدريبية فقط</span></div><div class="panel"><div class="rowBetween"><div><div class="eyebrow" style="color:var(--brand)">دقة المحاولة الأولى في هذه الجولة</div><div class="resultScore">${ar(percent(r.correct,r.total))}٪</div><p class="small muted">${ar(r.correct)} صحيحة من ${ar(r.total)}؛ لا تعادل درجة قياس</p></div><div class="stat" style="box-shadow:none;min-width:200px"><div class="statLabel">التلميحات / التخمينات / المتروك</div><div class="statNum" style="font-size:22px">${ar(r.hinted)} / ${ar(r.guessed)} / ${ar(r.skipped)}</div></div></div><div class="grid" style="margin-top:18px">${['quant','verbal'].map(x=>statCard('◆',SECTIONS[x],`${ar(sub[x]?.correct||0)} من ${ar(sub[x]?.total||0)}`,'محاولات أولى فقط')).join('')}</div>${d?`<div class="notice">استنتجنا مهارات بداية من إجاباتك، لكن المهارات ذات سؤال أو سؤالين فقط «تحتاج قياسًا إضافيًا». الخطوة التالية درس عملي ثم سؤالان تأكيديان.</div>`:''}<div class="inlineActions"><button class="btn btnTeal" data-action="openLesson" data-skill="${safe(nextSkill())}">افتح أول درس مناسب ←</button><button class="btn btnOutline" data-page="home">العودة للرئيسية</button><button class="btn btnOutline" data-action="toggleSolutions">${state.ui.showReportSolutions?'إخفاء الحلول':'راجع الأسئلة والحلول'}</button></div></div>${state.ui.showReportSolutions?`<div class="panel"><h3>مراجعة بعد تسليم الجولة</h3><div class="stack">${r.responses.map((resp,i)=>{let q=byId(resp.qid)||resp.questionSnapshot; if(!q)return '';let correct=resp.first===q.answer;return `<div class="reportCard"><div class="rowBetween"><b>سؤال ${ar(i+1)} • ${safe(skill(q.skill).title)}</b><span class="tag ${correct?'':'red'}">${correct?'صحيح':'يحتاج مراجعة'}</span></div>${q.passage?`<div class="small muted">${safe(q.passage)}</div>`:''}<p>${safe(q.stem)}</p><p class="small">إجابتك الأولى: <b>${resp.first==null?'متروك':safe(q.options[resp.first])}</b> • الإجابة الصحيحة: <b>${safe(q.options[q.answer])}</b></p><p class="small muted">${safe(q.explanation)}</p>${q.evidence?`<p class="small">دليل من النص: <mark>${safe(q.evidence)}</mark></p>`:''}</div>`}).join('')}</div></div>`:''}`}
function questionArea(q, a, r){let mode=a.mode,isd=mode==='diagnostic',ism=mode==='simulate',blind=isd||ism,phase=a.phase;
 const resp=r||{},retry=isd&&phase==='retry';let selected=retry?resp.second:resp.first;
 const isReview=isd&&phase==='review';if(isReview)return '';
 const answered= !blind&&a.stage==='result';
 const status=blind?'لن نظهر التصحيح إلا بعد التسليم':a.stage==='hint'?'تلميح بدون كشف الحل':a.stage==='second'?'المحاولة الثانية':a.stage==='result'?'اكتملت الخطوة، الآن افهم الفكرة':'أجب دون مساعدة أولًا';
 const options=q.options.map((o,i)=>{let cls='';if(a.stage==='result'){if(i===q.answer)cls=' correct';else if(i===resp.first)cls=' incorrect'}else if(selected===i)cls=' selected';let can=blind||a.stage==='answer'||a.stage==='second';return `<button type="button" class="option${cls}" data-action="choose" data-index="${i}" ${can?'':'disabled'} aria-pressed="${selected===i}"><span class="optLetter">${['أ','ب','ج','د'][i]}</span><span>${safe(o)}</span></button>`}).join('');
 return `<div class="panel" style="margin-top:16px"><div class="quizTop"><div><span class="tag">${safe(SECTIONS[q.section])} • ${safe(skill(q.skill).title)}</span> <span class="small muted">سؤال ${ar(a.idx+1)} من ${ar(a.ids.length)}</span></div><span class="tag ${a.stage==='hint'?'orange':''}">${safe(status)}</span></div><div class="progress" style="margin-top:14px"><span style="width:${percent(a.idx,a.ids.length)}%"></span></div>
 ${q.passage?`<div class="passage"><span class="tag">النص المشترك • ${safe(q.passageId)}</span><div>${safe(q.passage)}</div></div>`:''}<h2 class="quizTitle">${safe(q.stem)}</h2>
 ${blind?`<div class="formRow"><label class="check"><input type="checkbox" id="qFlag" ${resp.flag?'checked':''} data-action="flag"/> علّم السؤال للمراجعة</label><label class="check">ثقتك: <select id="confidence"><option ${resp.confidence==='متأكد'?'selected':''}>متأكد</option><option ${!resp.confidence||resp.confidence==='متردد'?'selected':''}>متردد</option><option ${resp.confidence==='خمنت'?'selected':''}>خمنت</option></select></label></div>`:a.stage==='answer'?`<div class="field"><label for="confidence">قبل الإجابة، وش درجة ثقتك؟</label><select id="confidence"><option>متأكد</option><option>متردد</option><option>خمنت</option></select></div>`:''}
 <div class="optionGrid">${options}</div>
 ${!blind&&a.stage==='hint'?`<div class="feedback warning"><h3>جرّب تفكر فيها من زاوية ثانية</h3><p>${safe(q.hint)}</p><button class="btn btnTeal" data-action="tryAgain">جاهز لمحاولة ثانية</button></div>`:''}
